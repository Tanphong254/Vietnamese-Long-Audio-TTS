name: Generate long audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Giọng đọc tiếng Việt"
        required: true
        type: choice
        default: Nam Minh
        options:
          - Nam Minh
          - Hoài My
      rate:
        description: "Tốc độ đọc"
        required: true
        type: choice
        default: "1.25"
        options: ["0.75", "1.0", "1.25", "1.5", "1.75"]

permissions:
  contents: read

concurrency:
  group: long-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Vietnamese audiobook
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Edge-TTS
        run: python -m pip install --upgrade pip edge-tts

      - name: Validate kichban.txt
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          source = Path("kichban.txt")
          if not source.is_file():
              sys.exit("Không tìm thấy kichban.txt ở thư mục gốc repository.")
          text = source.read_text(encoding="utf-8-sig")
          if not text.strip():
              sys.exit("kichban.txt đang trống. Hãy sửa tệp này trước khi chạy.")
          if text.strip() == "__DAN_NOI_DUNG_TRUYEN_VAO_DAY__":
              sys.exit("Hãy thay dòng hướng dẫn trong kichban.txt bằng nội dung truyện.")
          print(f"Đã nhận kichban.txt: {len(text):,} ký tự.")
          print("Sẽ tạo một MP3 đầu ra từ toàn bộ kịch bản.")
          PY

      - name: Generate one MP3 from the whole script
        env:
          VOICE_CHOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
        run: |
          case "$VOICE_CHOICE" in
            "Nam Minh") VOICE_ID="vi-VN-NamMinhNeural" ;;
            "Hoài My") VOICE_ID="vi-VN-HoaiMyNeural" ;;
            *) echo "::error::Giọng đọc không hợp lệ"; exit 1 ;;
          esac

          # One whole-script synthesis and one output MP3.
          # Edge-TTS may internally stream text fragments to its service.
          timeout --signal=INT --kill-after=30s 340m \
            python generate_audio.py \
              --input kichban.txt \
              --output outputs/audio_youtube.mp3 \
              --voice "$VOICE_ID" \
              --rate "$RATE" \
              --attempts 3

      - name: Upload MP3
        if: ${{ success() && hashFiles('outputs/audio_youtube.mp3') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-output
          path: outputs/audio_youtube.mp3
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload partial audio for diagnosis if generation fails
        if: ${{ failure() && hashFiles('outputs/audio_youtube.partial.mp3') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: partial-audio-diagnostic
          path: outputs/audio_youtube.partial.mp3
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
