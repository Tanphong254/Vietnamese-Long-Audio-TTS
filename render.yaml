services:
  - type: web
    name: vietnamese-long-audio-tts
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 3600 app:app
    healthCheckPath: /health
    envVars:
      - key: TTS_DATA_DIR
        value: /var/data
      - key: WEB_APP_PASSWORD
        sync: false
      - key: WEB_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: vietnamese-tts-data
      mountPath: /var/data
      sizeGB: 2
